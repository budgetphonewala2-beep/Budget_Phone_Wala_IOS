# Codemagic CI for the BudgetPhonewala customer app (Flutter, iOS + Android).
#
# Build settings:
#   None are needed: the public production Supabase URL and anon key are written by the env_file step below.
#
# Workflows
#   ios-compile-check  Builds the iOS app WITHOUT code signing. Proves the project compiles and tests pass on macOS.
#                      The result is not installable on a phone.
#   ios-unsigned-ipa   Unsigned .ipa. Not installable by itself; Sideloadly/AltStore can sign it with a FREE Apple ID (7-day install).
#   ios-signed-ipa     Builds an installable .ipa. Needs an Apple Developer Program membership:
#                      1) Codemagic > Teams > Integrations > App Store Connect: add an API key and name it as below.
#                      2) Register the iPhone's UDID in Apple Developer > Devices (for ad_hoc) or use TestFlight (app_store).
#   android-release    Signed APK + AAB (needs the upload keystore added under Codemagic > Code signing identities).

definitions:
  # The values below are PUBLIC (the Supabase anon key ships inside every app). They are written here on purpose so a stale
  # variable in the Codemagic dashboard can never point a build at the wrong project. The service-role key must never appear here.
  env_file: &env_file
    name: Create production env file and check it
    script: |
      mkdir -p env
      cat > env/prod.json <<EOF
      {
        "ENV": "production",
        "SUPABASE_URL": "https://ojzkyrkngxojpcpplhow.supabase.co",
        "SUPABASE_ANON_KEY": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qemt5cmtuZ3hvanBjcHBsaG93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjEyMzgsImV4cCI6MjEwNzg5NzIzOH0.L3ps3rOW7_8AkWdt7FJKOwkt9wnANCwoo8JpY0yZswM",
        "OAUTH_REDIRECT": "in.budgetphonewala.app://login-callback"
      }
      EOF
      # refuse to build against the deleted development project or with a privileged key
      if grep -q "adsiivnqfxxyjbmvsspz" env/prod.json; then echo "Refusing: env points at the old development project"; exit 1; fi
      if grep -qi "service_role" env/prod.json; then echo "Refusing: a privileged key is in the env file"; exit 1; fi
      python3 - <<'PY'
      import json,base64
      d=json.load(open("env/prod.json")); t=d["SUPABASE_ANON_KEY"].split(".")[1]; t+="="*(-len(t)%4)
      c=json.loads(base64.urlsafe_b64decode(t)); assert c["role"]=="anon" and c["ref"]=="ojzkyrkngxojpcpplhow", "anon key does not belong to production"
      print("env OK: production project, anon key")
      PY

workflows:
  ios-compile-check:
    name: iOS compile check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - *env_file
      - name: Dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Tests
        script: flutter test
      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign --dart-define-from-file=env/prod.json
    artifacts:
      - build/ios/iphoneos/Runner.app

  ios-unsigned-ipa:
    name: iOS unsigned .ipa (for free-Apple-ID sideloading)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - *env_file
      - name: Dependencies
        script: flutter pub get
      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign --dart-define-from-file=env/prod.json
      - name: Package unsigned .ipa
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry BudgetPhonewala-unsigned.ipa Payload
    artifacts:
      - BudgetPhonewala-unsigned.ipa

  ios-signed-ipa:
    name: iOS signed .ipa
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: BudgetPhonewala   # the name you give the App Store Connect API key in Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc          # use app_store for TestFlight / App Store
        bundle_identifier: in.budgetphonewala.app
    scripts:
      - *env_file
      - name: Dependencies
        script: flutter pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build .ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define-from-file=env/prod.json
    artifacts:
      - build/ios/ipa/*.ipa

  android-release:
    name: Android release (APK + AAB)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
    scripts:
      - *env_file
      - name: Dependencies
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Build
        script: |
          flutter build apk --release --dart-define-from-file=env/prod.json
          flutter build appbundle --release --dart-define-from-file=env/prod.json
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
